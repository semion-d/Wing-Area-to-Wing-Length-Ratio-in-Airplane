name: Compile LaTeX

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: "Update_Wing_Area_to_Wing_Length_Ratio.tex"

      - name: Commit PDF to repository
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update compiled PDF"
          file_pattern: "Update_Wing_Area_to_Wing_Length_Ratio.pdf"
